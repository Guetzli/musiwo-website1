# Pages CMS: definiert, was Laien bearbeiten dürfen.
# Alles, was hier nicht aufgeführt ist (Menü, Layout, CSS), bleibt für sie unsichtbar.

media:
  - name: bilder
    label: Bilder
    input: images
    output: /images
    categories: [image]
  - name: dokumente
    label: Dokumente
    input: dokumente
    output: /dokumente
    categories: [document]

content:
  - name: kurs
    label: Kursdaten (jährlich)
    type: file
    path: content/kurs.json
    format: json
    fields:
      - name: ausgabe
        label: Ausgabe
        type: string
        description: "z. B. 27. Kammermusikwoche"
      - name: termin
        label: Termin
        type: string
        description: "z. B. So 4. bis Sa 10. Oktober 2026"
        required: true
      - name: kursort
        label: Kursort
        type: string
      - name: kursort_link
        label: Link zum Kursort
        type: string
      - name: anmeldeschluss
        label: Anmeldeschluss
        type: string
        description: "z. B. 30. März 2026"
      - name: anmeldeformular
        label: Anmeldeformular (PDF)
        type: file
        options:
          media: dokumente
      - name: kontakt_email
        label: E-Mail für Anmeldungen und Kontakt
        type: string
        required: true

  - name: startseite
    label: Startseite
    type: file
    path: content/startseite.md
    format: yaml-frontmatter
    fields:
      - name: titel
        label: Titel
        type: string
        required: true
      - name: untertitel
        label: Kernaussage (grosse Schrift oben)
        type: text
      - name: titelbild
        label: Titelbild
        type: image
        options:
          media: bilder
      - name: body
        label: Text
        type: rich-text

  - name: leitung
    label: Musikalische Leitung
    type: collection
    path: content/leitung
    format: yaml-frontmatter
    filename: "{primary}.md"
    subfolders: false
    exclude:
      - leitung.11tydata.json
    view:
      primary: name
      fields: [name, anzeigen]
      sort: [reihenfolge, name]
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: foto
        label: Foto
        type: image
        options:
          media: bilder
          path: images/leitung
      - name: anzeigen
        label: Auf der Website anzeigen
        type: boolean
        default: true
      - name: reihenfolge
        label: Reihenfolge
        type: number
        description: "Kleinere Zahl = weiter oben (z. B. 10, 20, 30 …)"
        default: 100
      - name: body
        label: Kurzbiografie
        type: rich-text

  - name: impressionen
    label: Impressionen
    type: file
    path: content/impressionen.md
    format: yaml-frontmatter
    fields:
      - name: titel
        label: Titel
        type: string
        required: true
      - name: body
        label: Einleitungstext
        type: rich-text
      - name: bilder
        label: Fotos
        type: object
        list: true
        fields:
          - name: bild
            label: Foto
            type: image
            options:
              media: bilder
              path: images/impressionen
          - name: text
            label: Bildlegende
            type: string

  - name: anmeldung
    label: Anmeldung
    type: file
    path: content/anmeldung.md
    format: yaml-frontmatter
    fields:
      - name: titel
        label: Titel
        type: string
        required: true
      - name: body
        label: Text über dem Formular (Bedingungen, Kontoangaben)
        type: rich-text
      - name: zimmer
        label: Zimmerkategorien
        type: object
        list: true
        fields:
          - name: bezeichnung
            label: Bezeichnung
            type: string
            required: true
          - name: preis
            label: Preis
            type: string
